project_id = "REPLACE_WITH_YOUR_PROJECT_REF"

[functions.health]
verify_jwt = false

# 공개 API도 포함하지만 함수 내부에서 JWT/역할/RLS를 다시 검증합니다.
[functions.api]
verify_jwt = false

[functions.checkout-prepare]
verify_jwt = true

[functions.payment-confirm]
verify_jwt = true

[functions.payment-cancel]
verify_jwt = true

# 토스가 직접 호출하므로 JWT 대신 공급자 조회·서명·멱등성으로 검증합니다.
[functions.payment-webhook]
verify_jwt = false

# GitHub Actions 또는 Supabase Cron이 별도 FRUITMARKET_CRON_SECRET로 호출합니다.
[functions.scheduled-jobs]
verify_jwt = false

[functions.payout-run]
verify_jwt = true
